# /etc/nginx/sites-available/smarthr
# Replace app.example.lk with your domain, then:
#   sudo ln -s /etc/nginx/sites-available/smarthr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.example.lk

limit_req_zone $binary_remote_addr zone=smarthr_login:10m rate=10r/m;

server {
    listen 80;
    server_name app.example.lk;

    client_max_body_size 12m;   # uploads (documents, Excel imports) up to 10 MB

    # API straight to the backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/v1/auth/login {
        limit_req zone=smarthr_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static files, cached hard
    location /_next/static/ {
        alias /var/www/smarthr/frontend/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: the web console
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
